<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Odontogramas - SysOdonto</title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

    <link rel="stylesheet"
          th:href="@{/css/odontograma.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="app-container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content odontograma-page">

        <div class="page-header">
            <div>
                <h1>Odontogramas</h1>
                <p class="page-subtitle">
                    Selecione um paciente para consultar ou criar um odontograma.
                </p>
            </div>
        </div>

        <div th:if="${mensagemSucesso}"
             class="feedback feedback-success">
            <span class="feedback-icon">✓</span>
            <span th:text="${mensagemSucesso}"></span>
        </div>

        <div th:if="${mensagemErro}"
             class="feedback feedback-error">
            <span class="feedback-icon">!</span>
            <span th:text="${mensagemErro}"></span>
        </div>

        <section class="odonto-card">

            <div class="section-title">
                <h2>Selecionar paciente</h2>
                <p>Pesquise pelo nome do paciente.</p>
            </div>

            <form method="get"
                  th:action="@{/odontogramas}"
                  class="odonto-search">

                <input type="text"
                       name="pesquisa"
                       th:value="${pesquisa}"
                       placeholder="Nome do paciente">

                <button type="submit"
                        class="btn-primary">
                    Pesquisar
                </button>

            </form>

        </section>

        <section class="odonto-card">

            <div class="table-responsive">

                <table class="odonto-table">

                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Paciente</th>
                        <th class="column-actions">Ação</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="paciente : ${pacientes}">
                        <td th:text="${paciente.codigo}"></td>

                        <td>
                            <strong th:text="${paciente.nome}"></strong>
                        </td>

                        <td>
                            <a class="btn-table-view"
                               th:href="@{/odontogramas/paciente/{codigo}(codigo=${paciente.codigo})}">
                                Selecionar
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(pacientes)}">
                        <td colspan="3">
                            <div class="empty-state">
                                <strong>Nenhum paciente encontrado.</strong>
                            </div>
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

</body>
</html>
