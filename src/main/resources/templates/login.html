<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container narrow">
    <h1>Login</h1>
    <p>Frontend Web - Spring Security</p>

    <div class="alert error" th:if="${param.error}">Usuário ou senha inválidos.</div>
    <div class="alert success" th:if="${param.logout}">Logout realizado.</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Usuário</label>
        <input id="username" name="username" autocomplete="username" required>

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
    </form>

    <div class="dev-box">
        <strong>Usuários locais iniciais</strong>
        <p>USER: user / user123</p>
        <p>ADMIN: admin / admin123</p>
    </div>
</main>
</body>
</html>
