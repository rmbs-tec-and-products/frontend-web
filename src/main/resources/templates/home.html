<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SysOdonto</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="app-container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">

        <h1>SysOdonto</h1>

        <p>
            Bem-vindo,
            <strong th:text="${username}"></strong>. </p>

        <div class="dashboard-grid">

            <div class="dashboard-card">
                <h3>Pacientes</h3>
                <p>Cadastro, consulta e prontuário.</p>
            </div>

            <div class="dashboard-card">
                <h3>Agenda</h3>
                <p>Agendamentos e consultas.</p>
            </div>

            <div class="dashboard-card">
                <h3>Odontogramas</h3>
                <p>Tratamentos e procedimentos.</p>
            </div>

            <div class="dashboard-card">
                <h3>Financeiro</h3>
                <p>Caixa, contas a pagar e receber.</p>
            </div>

        </div>

    </main>

</div>

</body>
</html>
