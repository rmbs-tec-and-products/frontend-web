spring:
  application:
    name: frontend-web
  thymeleaf:
    cache: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Apenas para desenvolvimento local inicial.
# Em AWS, substituiremos por Secrets Manager/Cognito/JWT conforme a arquitetura evoluir.
app:
  security:
    user-name: ${APP_USER_NAME:user}
    user-password: ${APP_USER_PASSWORD:user123}
    admin-name: ${APP_ADMIN_NAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin123}
  backend:
    base-url: ${BACKEND_BASE_URL:http://localhost:8081}
